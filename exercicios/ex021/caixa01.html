<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixas</title>
    <style>
        h1{ /*Box-Level*/

            
            background-color: lightgray;
            height: 300px;
            width: 300px;
            /* Use a sequencia horaria */
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;

            /* Simplificado */

            border:10px solid darkslategray ;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px ;

            /*Simplificado*/
            padding: 10px;

            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;

            /*Simplificado*/
            margin: 20px 20px 40px 20px;

            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;

            /*Simplificado*/
            outline: 5px dashed salmon;
        }
        a{
            
            border-width: 10px;
            border-style: solid;
            border-color: red;

            /*Simplificado*/
            border: 10px solid red;
        }
    </style>
</head>
<body>
    <h1>Exmplo de caixa Box-Level</h1>
    <p>Parágrafo também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>Vamos ver como tudo isso funciona</p>
</body>
</html>
