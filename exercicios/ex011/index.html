<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Mideas em HTML5</title>
</head>
<body>
    <h1>Imagen Dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width:750px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem Flexível">
        
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5 </p>

    <audio preload="metadata" autoplay controls loop>
        <source src="midea/Soad-ld.mp3" type="audio/mpeg">
        <source src="midea/guanacast-33.mp3" type="audio/mpeg">

        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midea/Soad-ld.mp3"></a>Clique aqui para baixar o arquivo MP3</p>
    </audio>
    <audio src="midea/guanacast-33.mp3" autoplay controls></audio>
    <!--MP3 WAV OGG-->

    
</body>
</html>
